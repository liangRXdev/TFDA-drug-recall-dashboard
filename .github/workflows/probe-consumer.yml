# 暫時性診斷：分辨 consumer.fda.gov.tw 連不上是「IP 被擋」還是「TLS 協商不相容」。
# 只讀不寫、不 commit。確認結論後即刪除。
name: Probe consumer.fda.gov.tw
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Env
        run: |
          openssl version
          python3 -c "import ssl; print(ssl.OPENSSL_VERSION)"
          echo "--- runner egress IP ---"
          curl -s --max-time 15 https://api.ipify.org || echo "(ipify unreachable)"
          echo
      - name: TCP reachability
        run: |
          echo "--- DNS ---"
          getent hosts consumer.fda.gov.tw || echo "DNS FAIL"
          echo "--- TCP 443 ---"
          timeout 15 bash -c 'cat < /dev/null > /dev/tcp/consumer.fda.gov.tw/443' \
            && echo "TCP OK（連得上，非 IP 層封鎖）" || echo "TCP FAIL（IP 層被擋或無回應）"
      - name: openssl s_client handshake
        run: |
          for v in tls1_3 tls1_2 tls1_1; do
            echo "===== $v ====="
            timeout 20 openssl s_client -connect consumer.fda.gov.tw:443 \
              -servername consumer.fda.gov.tw -$v -brief </dev/null 2>&1 | head -20 || true
          done
      - name: openssl SECLEVEL=1 / legacy renegotiation
        run: |
          echo "===== SECLEVEL=1 ====="
          timeout 20 openssl s_client -connect consumer.fda.gov.tw:443 \
            -servername consumer.fda.gov.tw -cipher 'DEFAULT@SECLEVEL=1' -brief </dev/null 2>&1 | head -20 || true
          echo "===== legacy renegotiation ====="
          timeout 20 openssl s_client -connect consumer.fda.gov.tw:443 \
            -servername consumer.fda.gov.tw -legacy_renegotiation -brief </dev/null 2>&1 | head -20 || true
      - name: curl variants
        run: |
          echo "===== curl 預設 ====="
          curl -s -o /dev/null --max-time 25 -w 'http=%{http_code} tls=%{ssl_verify_result}\n' \
            https://consumer.fda.gov.tw/GMP/Product.aspx?nodeID=420 || echo "curl exit=$?"
          echo "===== curl --tlsv1.2 --tls-max 1.2 ====="
          curl -s -o /dev/null --max-time 25 --tlsv1.2 --tls-max 1.2 -w 'http=%{http_code}\n' \
            https://consumer.fda.gov.tw/GMP/Product.aspx?nodeID=420 || echo "curl exit=$?"
          echo "===== curl -A 瀏覽器 UA ====="
          curl -s -o /dev/null --max-time 25 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' \
            -w 'http=%{http_code}\n' https://consumer.fda.gov.tw/GMP/Product.aspx?nodeID=420 || echo "curl exit=$?"
      - name: Control — data.fda.gov.tw（已知可通）
        run: |
          curl -s -o /dev/null --max-time 25 -w 'data.fda.gov.tw http=%{http_code}\n' \
            https://data.fda.gov.tw/data/opendata/export/34/json || echo "curl exit=$?"
      - name: Other .gov.tw hosts（判斷是否整片 .gov.tw 都不通）
        run: |
          for h in www.fda.gov.tw www.nhi.gov.tw www.mohw.gov.tw; do
            curl -s -o /dev/null --max-time 20 -w "$h http=%{http_code}\n" "https://$h/" || echo "$h curl exit=$?"
          done
